name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sprawdz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format i lint
        run: pnpm lint

      - name: Typy
        run: pnpm tsc --noEmit

      - name: Budowanie produkcyjne
        run: pnpm build
